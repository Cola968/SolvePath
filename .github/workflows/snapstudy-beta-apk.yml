name: SnapStudy Beta APK

concurrency:
  group: snapstudy-beta-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

on:
  push:
    branches: ["snapstudy-mvp"]
    paths:
      - "src/**"
      - "app.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/snapstudy-beta-apk.yml"
  workflow_dispatch:

jobs:
  android-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Report beta build start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 11 --body "SnapStudy Android-Beta · Status: started · Run: https://github.com/Cola968/SolvePath/actions/runs/${GITHUB_RUN_ID}"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Sync lockfile when dependencies change
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! git diff --quiet -- pnpm-lock.yaml; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add pnpm-lock.yaml
            git commit -m "chore: sync SnapStudy lockfile"
            git push origin HEAD:snapstudy-mvp
          fi

      - name: Quality checks
        run: |
          pnpm typecheck
          node --check web/app.js

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SnapStudy-0.9.0-beta.apk

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapStudy-0.9.0-beta-android
          path: SnapStudy-0.9.0-beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snapstudy-beta-latest --yes --cleanup-tag || true
          gh release create snapstudy-beta-latest SnapStudy-0.9.0-beta.apk \
            --target "${GITHUB_SHA}" \
            --title "SnapStudy Android Beta" \
            --notes "Direkt installierbarer Android-Beta-Build für Tests. Nicht als finaler Play-Store-Upload-Key verwenden." \
            --prerelease

      - name: Report beta build
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 11 --body "SnapStudy Android-Beta · Status: ${{ job.status }} · Run: https://github.com/Cola968/SolvePath/actions/runs/${GITHUB_RUN_ID} · Release: https://github.com/Cola968/SolvePath/releases/tag/snapstudy-beta-latest"

# release-candidate-trigger-1
