name: SnapStudy Beta APK

permissions:
  contents: write

on:
  push:
    branches: ["snapstudy-mvp"]
    paths:
      - "src/**"
      - "web/**"
      - "app.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/snapstudy-beta-apk.yml"
  workflow_dispatch:

jobs:
  android-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install
        run: pnpm install --no-frozen-lockfile

      - name: Quality checks
        run: |
          pnpm typecheck
          node --check web/app.js

      - name: Generate Android project
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/release/app-release.apk SnapStudy-0.9.0-beta.apk

      - name: Upload beta APK
        uses: actions/upload-artifact@v4
        with:
          name: SnapStudy-0.9.0-beta-android
          path: SnapStudy-0.9.0-beta.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish stable beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete snapstudy-beta-latest --yes --cleanup-tag || true
          gh release create snapstudy-beta-latest SnapStudy-0.9.0-beta.apk \
            --target "${GITHUB_SHA}" \
            --title "SnapStudy Android Beta" \
            --notes "Direkt installierbarer Android-Beta-Build für Tests. Nicht als finaler Play-Store-Upload-Key verwenden." \
            --prerelease
