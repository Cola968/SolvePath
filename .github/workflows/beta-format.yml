name: Beta format

on:
  push:
    branches: ["feat/v0.5-beta-release"]
    paths:
      - ".github/workflows/beta-format.yml"

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Format beta files
        run: pnpm prettier --write src/app/index.tsx src/app/input.tsx src/app/settings.tsx src/app/exam.tsx src/app/pro.tsx src/app/_layout.tsx src/services/problem-analyzer.ts scripts/release-check.mjs

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts
          if git diff --cached --quiet; then
            echo "Nothing to format"
          else
            git commit -m "style: format beta release"
            git push
          fi
