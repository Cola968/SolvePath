name: Local engine setup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/local-engine-setup.yml

permissions:
  contents: write

jobs:
  install-and-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install existing dependencies
        run: pnpm install --frozen-lockfile

      - name: Add on-device OCR
        run: pnpm add expo-text-extractor

      - name: Format
        run: pnpm format

      - name: Commit dependency and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml src .github/workflows/local-engine-setup.yml
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "build: add on-device OCR runtime"
            git push
          fi

      - name: Verify
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm release:check
          pnpm build:export
