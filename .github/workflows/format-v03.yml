name: Format v0.3 release files

on:
  push:
    branches: ["feat/v0.3-real-analysis"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.3-real-analysis

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write server/src/providers/remote-analysis-provider.test.ts render.yaml

      - name: Commit formatted files
        run: |
          if git diff --quiet -- server/src/providers/remote-analysis-provider.test.ts render.yaml; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server/src/providers/remote-analysis-provider.test.ts render.yaml
          git commit -m "style: format v0.3 release files"
          git push
