name: Format quantity domain

on:
  push:
    branches: ["feat/v0.3-real-analysis"]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.3-real-analysis
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/domain/misconceptions/quantity.ts
      - name: Commit
        run: |
          if git diff --quiet -- src/domain/misconceptions/quantity.ts; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/domain/misconceptions/quantity.ts
          git commit -m "style: format quantity domain"
          git push
