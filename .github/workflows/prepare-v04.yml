name: Prepare v0.4

on:
  push:
    branches: ["feat/v0.4-subscriptions-math"]

permissions:
  contents: write

jobs:
  prepare:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/v0.4-subscriptions-math

      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Refresh lockfile
        run: pnpm install --no-frozen-lockfile

      - name: Format source
        run: pnpm format

      - name: Commit generated files
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml src server package.json app.json .env.example render.yaml README.md scripts RELEASE_CHECKLIST.md
          git commit -m "chore: prepare v0.4 release files"
          git push
