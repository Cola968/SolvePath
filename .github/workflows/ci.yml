name: CI

on:
  push:
    branches: ["main", "feat/**"]
  pull_request:
    branches: ["main"]

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Backend typecheck
        run: pnpm server:typecheck

      - name: Lint
        run: pnpm lint

      - name: Backend lint
        run: pnpm server:lint

      - name: Tests
        run: pnpm test

      - name: Backend tests
        run: pnpm server:test

      - name: Format check
        run: pnpm format:check

      - name: Release config check
        run: pnpm release:check

      - name: Android export
        run: pnpm build:export
